<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisionEdge · 相機設定</title>
<link rel="stylesheet" href="/static/primary_nav.css?v=2.4.9"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:white}h1{font-size:22px;margin:0}main{max-width:1150px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:white;border:1px solid #dfe2e7;border-radius:18px;padding:22px}h2{font-size:18px;margin-top:0}button,select,input{font:inherit;border:1px solid #dfe2e7;border-radius:8px;padding:9px;background:#f5f5f7;color:inherit}button{cursor:pointer}button:disabled,input:disabled,select:disabled{opacity:.5;cursor:default}.primary{background:#0071e3;color:white;border-color:#0071e3}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.fields{display:grid;gap:16px}.fields label{display:grid;grid-template-columns:1fr 130px;gap:5px}small{grid-column:1/-1;color:#69717d;line-height:1.5}p{line-height:1.65}img{width:100%;max-height:400px;object-fit:contain;background:#f5f5f7;border-radius:10px}[hidden]{display:none!important}#notice{padding:10px;border-radius:8px;background:#eef5ff;white-space:pre-wrap}details{margin:16px 0}summary{cursor:pointer}dialog{max-width:520px;border:1px solid #dfe2e7;border-radius:16px;padding:24px}dialog::backdrop{background:#0005}@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>VisionEdge · 相機設定</h1><select data-i18n-language aria-label="Language" onchange="VisionEdgeI18n.setLanguage(this.value)"><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option><option value="en">English</option><option value="es">Español</option></select></header>
<nav class="primary-navigation" aria-label="主要導覽"><button class="primary-tab" onclick="leaveCamera('/edge')">即時檢測</button><button class="primary-tab" onclick="leaveCamera('/template-studio')">取像與樣板</button><button class="primary-tab" onclick="leaveCamera('/flow-studio')">規則／流程</button></nav>
<main><section><h2>即時預覽</h2><p>先確認畫面，再調整取像。修改會影響所有產品的相機影像。</p><img id="preview" hidden alt="相機即時預覽"><div class="actions"><button id="start" onclick="startPreview()">啟動／查看即時預覽</button><button id="refresh" onclick="refreshCamera()">讀取相機狀態</button></div><p id="notice" role="status">等待設備確認</p><p id="device"></p><p>對焦、光學變焦與光圈尚未接入；不提供未確認有效的控制。畫面放大不等於光學調焦。</p></section>
<section><h2>取像控制</h2><p>相容模式只套用白平衡；自訂模式可調整設備支援的項目。實際效果請以預覽為準。</p><label>控制模式 <select id="mode" onchange="renderEnabled()"><option value="safe">相容模式</option><option value="manual">自訂模式</option><option value="off">不寫入控制</option></select></label><div id="basic" class="fields" style="margin-top:20px"></div><details><summary>進階影像控制</summary><div id="advanced" class="fields" style="margin-top:16px"></div></details><div class="actions"><button class="primary" id="apply" onclick="applyCamera()">儲存並套用相機設定</button><button id="discard" onclick="discardCamera()">放棄修改</button></div><p>套用時優先即時更新，必要時重啟相機；錄影或檢測工件進行中不能套用。變更後請重新擷取並驗證樣板。</p></section></main>
<script src="/static/visionedge_i18n.js?v=2.4.9"></script><script src="/static/camera_settings.js?v=2.4.9"></script></body></html>
